<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#06111f">
<title>AppEstudia - Analítica</title>
<style>
:root{--bg:#06111f;--panel:#0d2341;--primary:#2f9bff;--dark:#1557be;--text:#f0f8ff;--muted:#9db9d8;--danger:#ef4444;--success:#22c55e;--border:rgba(117,213,255,.16)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#06111f,#081a31 55%,#0b2344);color:var(--text);font-family:system-ui,sans-serif;padding-bottom:76px}.topbar{position:sticky;top:0;z-index:2;background:#06111ff5;padding:15px 17px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}.brand h1{margin:0;color:var(--primary);font-size:19px}.brand p{margin:2px 0 0;color:var(--muted);font-size:11px}.icon,.nav,button{border:0;cursor:pointer}.icon{width:42px;height:42px;border-radius:13px;background:#12365f;color:white;font-size:18px}.container{padding:13px}.section{display:none}.section.active{display:block}.card,.item,.chart{background:linear-gradient(180deg,#0e2546fa,#091a32fa);border:1px solid var(--border);border-radius:16px;padding:15px;margin-bottom:13px;box-shadow:0 10px 26px #0004}.item{background:#071425d9;box-shadow:none}.form-group{margin-bottom:11px}label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}input,select{width:100%;min-height:46px;background:#07172b;color:var(--text);border:1px solid #225080;border-radius:12px;padding:11px;font:inherit}.primary,.secondary,.success,.danger{width:100%;min-height:45px;padding:11px;border-radius:12px;color:white;font-weight:700}.primary{background:linear-gradient(135deg,var(--primary),var(--dark))}.secondary{background:#12365f}.success{background:linear-gradient(135deg,var(--success),#16803c)}.danger{background:linear-gradient(135deg,var(--danger),#b91c1c)}h2{font-size:17px;margin:0 0 12px}h3{font-size:14px;margin:0 0 7px}.list{display:flex;flex-direction:column;gap:8px}.meta{display:flex;flex-wrap:wrap;gap:5px;margin:5px 0}.chip,.badge{font-size:10px;padding:5px 8px;border-radius:8px;background:#0f2a4c;border:1px solid #2b5d96;color:#d8eeff}.badge{border-radius:99px;min-width:50px;text-align:center}.small,.empty{font-size:11px;color:var(--muted)}.empty{text-align:center;padding:12px}.progress{height:7px;background:#081424;border-radius:99px;overflow:hidden;margin-top:7px}.progress span{display:block;height:100%;background:linear-gradient(90deg,#38bdf8,#3b82f6)}.actions{display:flex;gap:7px;margin-top:9px}.actions button{flex:1;min-height:37px;font-size:11px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{text-align:center;padding:11px;background:#113158;border:1px solid var(--border);border-radius:13px}.stat label{margin:0}.stat strong{display:block;color:var(--primary);font-size:21px}.bar-chart{display:flex;align-items:flex-end;gap:6px;height:150px;padding:0 6px 17px}.bar-group{flex:1;text-align:center}.bar{position:relative;min-height:2px;background:linear-gradient(180deg,var(--primary),var(--dark));border-radius:4px 4px 0 0}.bar-value{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--primary)}.bar-label{font-size:8px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pie{width:140px;height:140px;border-radius:50%;margin:8px auto 12px;position:relative}.pie:after{content:'';position:absolute;inset:16px;border-radius:50%;background:#0d2545}.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;font-size:10px}.legend span{display:flex;align-items:center;gap:3px}.dot{width:9px;height:9px;border-radius:2px}.weekly{height:115px;display:flex;align-items:flex-end;gap:4px;padding-bottom:20px}.weekbar{flex:1;text-align:center}.weekbar .bar{background:linear-gradient(180deg,#38bdf8,#3b82f6)}.weeklabel{font-size:8px;color:var(--muted)}.insight{padding:10px;border-left:3px solid var(--primary);background:#2f9bff1a;margin:7px 0;font-size:12px;border-radius:0 7px 7px 0}.bottom{position:fixed;bottom:0;left:0;right:0;background:#0a1b32f7;border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:6px 0 calc(7px + env(safe-area-inset-bottom));z-index:3}.nav{background:transparent;color:var(--muted);padding:6px 7px;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:10px}.nav span:first-child{font-size:18px}.nav.active{color:var(--primary);background:#2f9bff1a}@media print{.topbar,.bottom,.actions,.form-group,button{display:none!important}.section{display:block!important}body{background:white;color:black;padding:15px}.card,.item,.chart{box-shadow:none;border:1px solid #ccc}}
</style>
</head>
<body>
<header class="topbar"><div class="brand"><h1>AppEstudia</h1><p>Planificador con analítica</p></div><div style="display:flex;gap:8px"><button class="icon" onclick="exportJSON()" title="Guardar respaldo JSON">💾</button><button class="icon" onclick="document.getElementById('jsonFile').click()" title="Cargar respaldo JSON">📂</button></div><input id="jsonFile" type="file" accept=".json,application/json" hidden onchange="importJSON(event)"></header>
<main class="container"><section id="home" class="section active"><div class="card"><h2>📊 Resumen</h2><div id="stats" class="stats"></div></div><div class="card"><h2>⚡ Próximas tareas</h2><div id="homeTasks" class="list"></div></div><div class="card"><button class="secondary" onclick="document.getElementById('jsonFile').click()">📂 Cargar archivo JSON guardado</button><br><br><button class="danger" onclick="resetAll()">🗑️ Borrar todo</button></div></section><section id="subjects" class="section"><div class="card"><h2>➕ Nueva materia</h2><div class="form-group"><label>Nombre</label><input id="subjectName" placeholder="Ej: Ingeniería de Software"></div><div class="form-group"><label>Docente</label><input id="teacher" placeholder="Ej: Ing. Pérez"></div><div class="form-group"><label>Meta semanal de horas</label><input id="goal" type="number" min="0" step=".5" value="4"></div><button class="primary" onclick="addSubject()">Guardar materia</button></div><div id="subjectsList" class="list"></div></section><section id="tasks" class="section"><div class="card"><h2>➕ Nueva tarea</h2><div class="form-group"><label>Materia</label><select id="taskSubject"></select></div><div class="form-group"><label>Título</label><input id="taskTitle" placeholder="Ej: Proyecto final"></div><div class="form-group"><label>Fecha límite</label><input id="taskDate" type="date"></div><div class="form-group"><label>Horas necesarias</label><input id="taskHours" type="number" min="0" step=".5" value="2"></div><button class="primary" onclick="addTask()">Guardar tarea</button></div><div id="tasksList" class="list"></div></section><section id="study" class="section"><div class="card"><h2>⏱️ Registrar estudio</h2><div class="form-group"><label>Materia</label><select id="studySubject"></select></div><div class="form-group"><label>Horas</label><input id="studyHours" type="number" min=".5" step=".5" value="1"></div><div class="form-group"><label>Tema</label><input id="studyTopic" placeholder="Ej: Requisitos funcionales"></div><button class="success" onclick="addStudy()">Guardar sesión</button></div><div id="studyList" class="list"></div></section><section id="analytics" class="section"><div class="card"><h2>📈 Analítica</h2><div class="chart"><h3>Horas por materia</h3><div id="bars" class="bar-chart"></div></div><div class="chart"><h3>Distribución de horas</h3><div id="pie" class="pie"></div><div id="legend" class="legend"></div></div><div class="chart"><h3>Actividad últimos 7 días</h3><div id="weekly" class="weekly"></div></div><div class="chart"><h3>Progreso por materia</h3><div id="progressList" class="list"></div></div><div class="chart"><h3>Metas semanales</h3><div id="goalsList" class="list"></div></div><div class="chart"><h3>Insights</h3><div id="insights"></div></div><div class="card"><h2>📄 Exportar análisis</h2><div class="actions"><button class="primary" onclick="exportHTML()">📄 Reporte HTML</button><button class="secondary" onclick="exportCSV()">📊 CSV</button><button class="success" onclick="print()">🖨️ Imprimir</button></div></div></div></section></main><nav class="bottom"><button class="nav active" onclick="tab('home',this)"><span>📊</span>Resumen</button><button class="nav" onclick="tab('subjects',this)"><span>📚</span>Materias</button><button class="nav" onclick="tab('tasks',this)"><span>📝</span>Tareas</button><button class="nav" onclick="tab('study',this)"><span>⏱️</span>Estudio</button><button class="nav" onclick="tab('analytics',this)"><span>📈</span>Analítica</button></nav><script>const K='appestudia_analytics_v1';let d=JSON.parse(localStorage.getItem(K)||'{"subjects":[],"tasks":[],"studies":[]}');d.subjects??=[];d.tasks??=[];d.studies??=[];const C=['#2f9bff','#22c55e','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#ec4899'];const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),save=()=>{localStorage.setItem(K,JSON.stringify(d));render()},sn=id=>d.subjects.find(x=>x.id===id)?.name||'Sin materia',fmt=x=>x?new Date(x+'T00:00:00').toLocaleDateString('es-CO',{day:'2-digit',month:'short'}):'Sin fecha';function tab(id,b){document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));b.classList.add('active')}function addSubject(){let n=subjectName.value.trim();if(!n)return alert('Escribe la materia');d.subjects.push({id:uid(),name:n,teacher:teacher.value.trim(),goal:+goal.value||0});subjectName.value='';teacher.value='';save()}function delSubject(id){if(!confirm('¿Eliminar materia y datos?'))return;d.subjects=d.subjects.filter(x=>x.id!==id);d.tasks=d.tasks.filter(x=>x.subject!==id);d.studies=d.studies.filter(x=>x.subject!==id);save()}function addTask(){if(!taskSubject.value||!taskTitle.value.trim())return alert('Completa materia y título');d.tasks.push({id:uid(),subject:taskSubject.value,title:taskTitle.value.trim(),date:taskDate.value,hours:+taskHours.value||0,progress:0,status:'Por hacer'});taskTitle.value='';save()}function changeProgress(id,n){let x=d.tasks.find(t=>t.id===id);if(x){x.progress=Math.max(0,Math.min(100,x.progress+n));x.status=x.progress===100?'Hecha':x.progress?'En progreso':'Por hacer';save()}}function delTask(id){d.tasks=d.tasks.filter(x=>x.id!==id);save()}function addStudy(){if(!studySubject.value||!studyTopic.value.trim()||!+studyHours.value)return alert('Completa los datos');d.studies.unshift({id:uid(),subject:studySubject.value,topic:studyTopic.value.trim(),hours:+studyHours.value,date:new Date().toISOString().slice(0,10)});studyTopic.value='';save()}function delStudy(id){d.studies=d.studies.filter(x=>x.id!==id);save()}function subjectStats(){return d.subjects.map((s,i)=>{let tasks=d.tasks.filter(t=>t.subject===s.id),hours=d.studies.filter(x=>x.subject===s.id).reduce((a,b)=>a+b.hours,0);return{id:s.id,name:s.name,hours,tasks,total:tasks.length,done:tasks.filter(x=>x.status==='Hecha').length,progress:tasks.length?Math.round(tasks.reduce((a,b)=>a+b.progress,0)/tasks.length):0,goal:s.goal||0,color:C[i%C.length]}})}function week(){let r=[],n=new Date;for(let i=6;i>=0;i--){let x=new Date(n);x.setDate(x.getDate()-i);let k=x.toISOString().slice(0,10);r.push({day:x.toLocaleDateString('es-CO',{weekday:'short'}),hours:d.studies.filter(s=>s.date===k).reduce((a,b)=>a+b.hours,0)})}return r}function taskHTML(t,full){return`<div class="item"><div class="item-top"><div><h3>${t.title}</h3><div class="meta"><span class="chip">${sn(t.subject)}</span><span class="chip">${fmt(t.date)}</span><span class="chip">${t.status}</span></div></div><span class="badge">${t.progress}%</span></div>${full?`<div class="small">Horas: ${t.hours}</div><div class="progress"><span style="width:${t.progress}%"></span></div><div class="actions"><button class="secondary" onclick="changeProgress('${t.id}',-10)">-10%</button><button class="primary" onclick="changeProgress('${t.id}',10)">+10%</button><button class="danger" onclick="delTask('${t.id}')">Eliminar</button></div>`:''}</div>`}function renderCharts(){let s=subjectStats(),max=Math.max(...s.map(x=>x.hours),1);bars.innerHTML=s.filter(x=>x.hours).map(x=>`<div class="bar-group"><div class="bar" style="height:${x.hours/max*100}%"><span class="bar-value">${x.hours.toFixed(1)}h</span></div><div class="bar-label">${x.name}</div></div>`).join('')||'<div class="empty">Sin sesiones</div>';let total=s.reduce((a,b)=>a+b.hours,0),start=0,g=[];s.filter(x=>x.hours).forEach(x=>{let deg=x.hours/total*360;g.push(`${x.color} ${start}deg ${start+deg}deg`);start+=deg});pie.style.background=total?`conic-gradient(${g.join(',')})`:'#12365f';legend.innerHTML=s.filter(x=>x.hours).map(x=>`<span><i class="dot" style="background:${x.color}"></i>${x.name}: ${x.hours.toFixed(1)}h</span>`).join('')||'<div class="empty">Sin datos</div>';let w=week(),wm=Math.max(...w.map(x=>x.hours),1);weekly.innerHTML=w.map(x=>`<div class="weekbar"><div class="bar" style="height:${x.hours/wm*100}%"></div><div class="weeklabel">${x.day}</div></div>`).join('');progressList.innerHTML=s.filter(x=>x.total).map(x=>`<div class="item"><div class="item-top"><h3>${x.name}</h3><span class="badge">${x.progress}%</span></div><div class="small">${x.done}/${x.total} tareas</div><div class="progress"><span style="width:${x.progress}%"></span></div></div>`).join('')||'<div class="empty">Sin tareas</div>';goalsList.innerHTML=s.filter(x=>x.goal).map(x=>{let p=Math.min(100,x.hours/x.goal*100);return`<div class="item"><div class="item-top"><h3>${x.name}</h3><span class="badge">${p.toFixed(0)}%</span></div><div class="small">Meta: ${x.goal}h · Real: ${x.hours.toFixed(1)}h</div><div class="progress"><span style="width:${p}%"></span></div></div>`}).join('')||'<div class="empty">Configura metas por materia</div>';let ins=[];if(total){let mx=s.reduce((a,b)=>a.hours>b.hours?a:b),mn=s.reduce((a,b)=>a.hours<b.hours?a:b);if(mx.hours&&mn.hours/mx.hours<.3)ins.push(`⚠️ ${mn.name} necesita más dedicación que ${mx.name}.`);s.forEach(x=>{if(x.goal&&x.hours<x.goal)ins.push(`🎯 ${x.name}: ${x.hours.toFixed(1)}h de ${x.goal}h meta.`);else if(x.goal)ins.push(`✅ ${x.name}: meta cumplida.`)});let days=w.filter(x=>x.hours>0).length;if(days<3)ins.push(`📉 Solo ${days} días activos esta semana.`);else if(days>=5)ins.push(`🔥 ${days} días activos esta semana.`)}else ins.push('📊 Registra sesiones para generar insights.');insights.innerHTML=ins.map(x=>`<div class="insight">${x}</div>`).join('')}function render(){let o=d.subjects.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');taskSubject.innerHTML=o;studySubject.innerHTML=o;let h=d.studies.reduce((a,b)=>a+b.hours,0),active=d.tasks.filter(x=>x.status!=='Hecha').length,p=d.tasks.length?Math.round(d.tasks.reduce((a,b)=>a+b.progress,0)/d.tasks.length):0;stats.innerHTML=`<div class="stat"><label>Materias</label><strong>${d.subjects.length}</strong></div><div class="stat"><label>Tareas activas</label><strong>${active}</strong></div><div class="stat"><label>Horas</label><strong>${h.toFixed(1)}</strong></div><div class="stat"><label>Progreso</label><strong>${p}%</strong></div>`;homeTasks.innerHTML=d.tasks.filter(x=>x.status!=='Hecha').slice(0,5).map(x=>taskHTML(x,false)).join('')||'<div class="empty">Todo al día</div>';subjectsList.innerHTML=d.subjects.map(s=>`<div class="item"><h3>${s.name}</h3><div class="meta"><span class="chip">${s.teacher||'Sin docente'}</span><span class="chip">Meta: ${s.goal||0}h</span></div><button class="danger" onclick="delSubject('${s.id}')">Eliminar</button></div>`).join('')||'<div class="empty">Sin materias</div>';tasksList.innerHTML=d.tasks.map(x=>taskHTML(x,true)).join('')||'<div class="empty">Sin tareas</div>';studyList.innerHTML=d.studies.map(x=>`<div class="item"><h3>${x.topic}</h3><div class="meta"><span class="chip">${sn(x.subject)}</span><span class="chip">${x.hours}h</span><span class="chip">${fmt(x.date)}</span></div><button class="danger" onclick="delStudy('${x.id}')">Eliminar</button></div>`).join('')||'<div class="empty">Sin sesiones</div>';renderCharts()}function download(c,n,t){let b=new Blob([c],{type:t}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=n;a.click();URL.revokeObjectURL(u)}function exportJSON(){download(JSON.stringify(d,null,2),'appestudia-respaldo.json','application/json')}function importJSON(e){let f=e.target.files[0],r=new FileReader();if(!f)return;r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.subjects||!x.tasks||!x.studies)throw 0;d=x;save();alert('Respaldo cargado correctamente')}catch{alert('JSON inválido')}};r.readAsText(f);e.target.value=''}function resetAll(){if(confirm('¿Borrar todo?')){d={subjects:[],tasks:[],studies:[]};save()}}function exportCSV(){let rows=[['Tipo','Materia','Detalle','Valor']];subjectStats().forEach(s=>{rows.push(['Materia',s.name,'Horas',s.hours+'h']);rows.push(['Materia',s.name,'Progreso',s.progress+'%'])});d.tasks.forEach(t=>rows.push(['Tarea',sn(t.subject),t.title,t.status+' '+t.progress+'%']));d.studies.forEach(s=>rows.push(['Sesión',sn(s.subject),s.topic,s.hours+'h']));download(rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\n'),'appestudia-analisis.csv','text/csv')}function exportHTML(){let s=subjectStats(),total=s.reduce((a,b)=>a+b.hours,0),html=`<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Reporte AppEstudia</title><style>body{font-family:Arial;max-width:850px;margin:auto;padding:24px;color:#17324d}h1,h2{color:#126dcc}table{width:100%;border-collapse:collapse;margin:12px 0}th,td{border:1px solid #ccd8e5;padding:8px}th{background:#eaf4ff}.box{display:inline-block;padding:14px;margin:4px;background:#f1f7fc;border-radius:8px}</style></head><body><h1>📊 Reporte AppEstudia</h1><p>Generado: ${new Date().toLocaleDateString('es-CO')}</p><div class="box"><b>Materias</b><br>${s.length}</div><div class="box"><b>Horas</b><br>${total.toFixed(1)}h</div><div class="box"><b>Tareas</b><br>${d.tasks.length}</div><h2>Horas por materia</h2><table><tr><th>Materia</th><th>Horas</th><th>Progreso</th><th>Meta</th></tr>${s.map(x=>`<tr><td>${x.name}</td><td>${x.hours.toFixed(1)}h</td><td>${x.progress}%</td><td>${x.goal||0}h</td></tr>`).join('')}</table><h2>Tareas</h2><table><tr><th>Materia</th><th>Título</th><th>Estado</th></tr>${d.tasks.map(t=>`<tr><td>${sn(t.subject)}</td><td>${t.title}</td><td>${t.status} (${t.progress}%)</td></tr>`).join('')}</table></body></html>`;download(html,'appestudia-reporte.html','text/html')}render();
</script>
</body>
</html>
